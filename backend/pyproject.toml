[project]
name = "coach-dashboard-backend"
version = "0.1.0"
description = "KG-backed coach dashboard — FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "networkx>=3.2",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]
# Answer-quality eval lane (`make eval-ragas`) — optional, LLM-judge based.
# Kept out of `dev` so the deterministic gate stays dependency-light.
# Pinned to the ragas 0.2.x / langchain 0.3.x matrix: ragas 0.4.x ships an
# import of `langchain_community.chat_models.vertexai`, which langchain-community
# >=0.4 removed — so the newest resolve breaks at import. This matrix is
# self-consistent.
eval = [
    "ragas>=0.2.14,<0.3",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-anthropic>=0.2,<0.4",
    "langchain-voyageai>=0.1,<0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
