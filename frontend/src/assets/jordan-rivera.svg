<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-label="Synthetic illustrated portrait of Jordan Rivera (fictional member)">
  <!-- Synthetic, fictional member portrait — flat illustration in the Future DS
       palette. No real person; generated as project art per the spec's
       "generate additional data synthetically" rule. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e8ea"/>
      <stop offset="0.5" stop-color="#f3ecd9"/>
      <stop offset="1" stop-color="#f4e8c6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="300" height="260"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="300" height="260" fill="url(#bg)"/>

    <!-- accent halo -->
    <circle cx="150" cy="118" r="88" fill="#f1ce46"/>

    <!-- neck -->
    <rect x="138" y="126" width="24" height="28" rx="10" fill="#c98e63"/>

    <!-- hair: smooth head silhouette with a top bun -->
    <circle cx="150" cy="52" r="14" fill="#201f1c"/>
    <ellipse cx="150" cy="88" rx="35" ry="37" fill="#201f1c"/>

    <!-- face (inset into the hair shape — the rim reads as the hairline) -->
    <path d="M123 92 q0 -24 27 -24 q27 0 27 24 l0 10 q0 26 -27 26 q-27 0 -27 -26 z" fill="#d59a6e"/>

    <!-- minimal features -->
    <path d="M134 100 q5 -4 10 0" stroke="#2a2410" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M156 100 q5 -4 10 0" stroke="#2a2410" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M148 108 q3 5 0 8" stroke="#b87a52" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M141 124 q9 6 18 0" stroke="#9c5a38" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- shoulders / athletic top -->
    <path d="M70 260 q4 -74 56 -106 q12 14 24 14 q12 0 24 -14 q52 32 56 106 z" fill="#242320"/>
    <path d="M120 168 q30 22 60 0 l-6 -10 q-24 16 -48 0 z" fill="#2c2a26"/>
  </g>
</svg>
