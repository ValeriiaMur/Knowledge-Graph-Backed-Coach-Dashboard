<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">KG-Backed Coach Dashboard — System Design</text>

  <!-- Frontend -->
  <rect x="40" y="60" width="880" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="84" font-size="14" font-weight="bold" fill="#1d4ed8">React + Vite Dashboard (strict TS)</text>
  <rect x="60" y="96" width="190" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="155" y="116" text-anchor="middle" font-size="12" fill="#1e3a5f">Workout Generator</text>
  <text x="155" y="132" text-anchor="middle" font-size="10" fill="#64748b">prompt + time window</text>
  <rect x="270" y="96" width="190" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="365" y="116" text-anchor="middle" font-size="12" fill="#1e3a5f">Coach AI Copilot</text>
  <text x="365" y="132" text-anchor="middle" font-size="10" fill="#64748b">chat · quick prompts · charts</text>
  <rect x="480" y="96" width="190" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="575" y="116" text-anchor="middle" font-size="12" fill="#1e3a5f">Provenance Trace View</text>
  <text x="575" y="132" text-anchor="middle" font-size="10" fill="#64748b">why chosen / what filtered</text>
  <rect x="690" y="96" width="190" height="48" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="785" y="116" text-anchor="middle" font-size="12" fill="#1e3a5f">Graph Visualization</text>
  <text x="785" y="132" text-anchor="middle" font-size="10" fill="#64748b">KG + traversal paths</text>

  <!-- API -->
  <line x1="480" y1="160" x2="480" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="182" font-size="10" fill="#64748b">REST + SSE streaming</text>
  <rect x="300" y="194" width="360" height="44" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">FastAPI Backend (Python)</text>
  <text x="480" y="231" text-anchor="middle" font-size="10" fill="#64748b">typed contracts · .env keys · structured trace logging</text>

  <!-- Agentic runtime -->
  <line x1="480" y1="238" x2="480" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="268" width="880" height="150" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="60" y="292" font-size="14" font-weight="bold" fill="#a16207">Agentic Runtime — hand-rolled orchestrator (Claude tool-use loop)</text>

  <rect x="60" y="306" width="195" height="92" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="157" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">1 · Concept Resolver</text>
  <text x="157" y="344" text-anchor="middle" font-size="10" fill="#64748b">exact → fuzzy → embedding</text>
  <text x="157" y="359" text-anchor="middle" font-size="10" fill="#64748b">confidence thresholds</text>
  <text x="157" y="374" text-anchor="middle" font-size="10" fill="#64748b">graceful no-match</text>

  <rect x="275" y="306" width="195" height="92" rx="6" fill="#fff1f2" stroke="#f43f5e"/>
  <text x="372" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#9f1239">2 · Safety Filter</text>
  <text x="372" y="344" text-anchor="middle" font-size="10" fill="#64748b">deterministic graph traversal</text>
  <text x="372" y="359" text-anchor="middle" font-size="10" fill="#64748b">part-of · requires ·</text>
  <text x="372" y="374" text-anchor="middle" font-size="10" fill="#64748b">contraindicated-for — no LLM</text>

  <rect x="490" y="306" width="195" height="92" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="587" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">3 · Plan Composer</text>
  <text x="587" y="344" text-anchor="middle" font-size="10" fill="#64748b">warmup / main / cooldown</text>
  <text x="587" y="359" text-anchor="middle" font-size="10" fill="#64748b">sets · reps · rest</text>
  <text x="587" y="374" text-anchor="middle" font-size="10" fill="#64748b">from filtered candidates only</text>

  <rect x="705" y="306" width="195" height="92" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="802" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">4 · Copilot Retrieval</text>
  <text x="802" y="344" text-anchor="middle" font-size="10" fill="#64748b">member-context queries</text>
  <text x="802" y="359" text-anchor="middle" font-size="10" fill="#64748b">brief · churn · trends</text>
  <text x="802" y="374" text-anchor="middle" font-size="10" fill="#64748b">grounded, never invented</text>

  <!-- Data layer -->
  <line x1="157" y1="418" x2="157" y2="448" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="372" y1="418" x2="372" y2="448" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="587" y1="418" x2="587" y2="448" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="802" y1="418" x2="802" y2="448" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="880" height="110" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#7e22ce">Data Layer — in-process NetworkX graphs, JSON persistence</text>

  <rect x="60" y="486" width="260" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="190" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#581c87">KG 1 · Movement / Clinical</text>
  <text x="190" y="522" text-anchor="middle" font-size="10" fill="#64748b">exercises · muscles · joints · equipment</text>
  <text x="190" y="537" text-anchor="middle" font-size="10" fill="#64748b">SKOS maps → SNOMED / OPE codes</text>

  <rect x="340" y="486" width="260" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="470" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#581c87">KG 2 · Member Context</text>
  <text x="470" y="522" text-anchor="middle" font-size="10" fill="#64748b">profile · injuries · adherence · biomarkers</text>
  <text x="470" y="537" text-anchor="middle" font-size="10" fill="#64748b">labs · chats · churn signals</text>

  <rect x="620" y="486" width="280" height="62" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="760" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#581c87">Provenance + Trace Store</text>
  <text x="760" y="522" text-anchor="middle" font-size="10" fill="#64748b">PROV-O records · structured JSON logs</text>
  <text x="760" y="537" text-anchor="middle" font-size="10" fill="#64748b">LLM / tool / graph-query traces</text>

  <!-- External APIs -->
  <rect x="180" y="585" width="280" height="40" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="320" y="603" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">Anthropic API (Claude)</text>
  <text x="320" y="618" text-anchor="middle" font-size="10" fill="#64748b">generation · tool use · streaming</text>
  <rect x="500" y="585" width="280" height="40" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="640" y="603" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">Voyage AI</text>
  <text x="640" y="618" text-anchor="middle" font-size="10" fill="#64748b">embeddings — resolver pass 3</text>

  <line x1="320" y1="585" x2="320" y2="563" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="640" y1="585" x2="640" y2="563" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ingestion note -->
  <text x="60" y="578" font-size="10" fill="#94a3b8">Ingestion: data/exercises.json + data/member-context.json → graph builders (offline, at startup)</text>
</svg>
